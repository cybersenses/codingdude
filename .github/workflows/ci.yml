name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Required check: python gates. Keep the job name stable — branch
  # protection requires it by name (docs/GITHUB-STRATEGY.md).
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: claim_check validates commit refs against git, and
          # a depth-1 clone made every historical ref unresolvable (#267).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      # TEMPORARY (#267 diagnosis): interrogate check_paths on the runner.
      - name: Debug claim_check internals
        run: |
          uv run python -c "
          import os, shutil, subprocess, sys
          sys.path.insert(0, 'tools')
          import claim_check as cc
          tok = 'src/codingdude/store.py'
          print('which git:', shutil.which('git'))
          print('PATH[0:3]:', os.environ['PATH'].split(os.pathsep)[:3])
          git = shutil.which('git')
          def probe(label, argv, env=None):
              r = subprocess.run([git, *argv, 'check-ignore', '-q', '--', tok],
                                 cwd=cc.ROOT, capture_output=True, text=True, env=env)
              print(label, 'rc=', r.returncode, 'err=', r.stderr.strip()[:120])
          probe('plain           :', [])
          probe('c-nul           :', ['-c', 'core.excludesFile=nul'])
          probe('c-devnull-lit   :', ['-c', 'core.excludesFile=/dev/null'])
          env = dict(os.environ, GIT_CONFIG_GLOBAL='nul', GIT_CONFIG_NOSYSTEM='1')
          probe('env-global-nul  :', [], env)
          env2 = dict(os.environ, GIT_CONFIG_GLOBAL=os.devnull, GIT_CONFIG_NOSYSTEM='1')
          probe('env-global-dev  :', [], env2)
          print('os.devnull:', os.devnull)
          print('cc._is_ignored:', cc._is_ignored(tok, cc.ROOT))
          r = subprocess.run([git, 'config', '--list', '--show-origin'],
                             cwd=cc.ROOT, capture_output=True, text=True)
          print('config lines w excludes/ignore:')
          for ln in r.stdout.splitlines():
              if 'exclud' in ln.lower() or 'ignor' in ln.lower():
                  print('   ', ln)
          "
      - name: Lint
        run: uv run ruff check src tests bench.py
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q

  # Required check: frontend gates (CI previously did not cover frontend/.
  # Job name is a required status check — do not rename casually.
  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  # Advisory: benchmark noise must never block a merge
  # (docs/GITHUB-STRATEGY.md, CI policy).
  bench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Benchmark (scripted)
        run: uv run python bench.py
