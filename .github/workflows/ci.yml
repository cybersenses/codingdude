name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Required check: python gates. Keep the job name stable — branch
  # protection requires it by name (docs/GITHUB-STRATEGY.md).
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: claim_check validates commit refs against git, and
          # a depth-1 clone made every historical ref unresolvable (#267).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      # TEMPORARY (#267 diagnosis): interrogate check_paths on the runner.
      - name: Debug claim_check internals
        run: |
          uv run python -c "
          import sys; sys.path.insert(0, 'tools')
          import claim_check as cc
          tok = 'src/codingdude/store.py'
          print('ROOT =', cc.ROOT)
          print('exists():', (cc.ROOT / tok).exists())
          tracked = cc._tracked_files(cc.ROOT)
          print('tracked count:', len(tracked))
          print('tracked[0:3]:', tracked[:3])
          print('tracked match:', [n for n in tracked if n.endswith('/' + tok) or n == tok])
          print('_is_ignored:', cc._is_ignored(tok, cc.ROOT))
          print('_path_exists:', cc._path_exists(tok, cc.ROOT))
          print('check_paths:', cc.check_paths('See `src/codingdude/store.py` for the writer.'))
          "
      - name: Lint
        run: uv run ruff check src tests bench.py
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q

  # Required check: frontend gates (CI previously did not cover frontend/.
  # Job name is a required status check — do not rename casually.
  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  # Advisory: benchmark noise must never block a merge
  # (docs/GITHUB-STRATEGY.md, CI policy).
  bench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Benchmark (scripted)
        run: uv run python bench.py
