name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint
        run: uv run ruff check src tests bench.py
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q
      - name: Benchmark (scripted)
        run: uv run python bench.py
