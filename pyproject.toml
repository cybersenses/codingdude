[project]
name = "codingdude"
version = "0.3.0"
description = "CodingDude — a personal coding agent built with pydantic-ai"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "fastapi>=0.141.1",
    "fastmcp[server]>=4.0.3",
    "markdownify>=1.2.3",
    "pydantic-ai>=2.40.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "vulture>=2.16",
    "websockets>=16.1.1",
]

[project.scripts]
codingdude = "codingdude.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "httpx>=0.28.1",
    "ruff>=0.16.6",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
packages = ["codingdude"]
explicit_package_bases = true
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
