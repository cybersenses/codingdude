[project]
name = "codingdude"
version = "0.1.0"
description = "CodingDude — a personal coding agent built with pydantic-ai"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "markdownify>=1.2.3",
    "pydantic-ai>=2.40.0",
]

[project.scripts]
codingdude = "codingdude.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
packages = ["codingdude"]
explicit_package_bases = true
mypy_path = "src"
