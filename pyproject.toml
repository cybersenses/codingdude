[project]
name = "codingdude"
version = "0.4.0"
description = "CodingDude — a personal coding agent built with pydantic-ai"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "fastapi>=0.141.1",
    "fastmcp[server]>=4.0.3",
    "markdownify>=1.2.3",
    "pydantic-ai>=2.40.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-c>=0.24.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
    "tree-sitter-rust>=0.24.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-kotlin>=1.1.0",
    "tree-sitter-html>=0.23.0",
    "tree-sitter-css>=0.25.0",
    "vulture>=2.16",
    "websockets>=16.1.1",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-php>=0.24.1",
    "tree-sitter-json>=0.24.8",
    "tree-sitter-yaml>=0.7.2",
    "tree-sitter-toml>=0.7.0",
    "tree-sitter-bash>=0.25.1",
    # R32 #65: fallback grammar source for suffixes without a pin above.
    "tree-sitter-language-pack>=1.0.0",
    "bandit>=1.9.4",
]

[project.scripts]
codingdude = "codingdude.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "httpx>=0.28.1",
    "ruff>=0.16.6",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.10.1",
    "playwright>=1.62.0",
    "mutmut<3",
    "hypothesis>=6.168.2",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
norecursedirs = ["reference"]

[tool.mypy]
packages = ["codingdude"]
explicit_package_bases = true
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
